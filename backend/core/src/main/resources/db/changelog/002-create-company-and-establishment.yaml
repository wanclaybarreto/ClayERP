databaseChangeLog:

  - changeSet:
      id: 002-1-create-company
      author: Wanclay Barreto

      changes:

        - createTable:
            tableName: company

            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: document_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: document_number
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true


  - changeSet:
      id: 002-2-create-establishment
      author: Wanclay Barreto

      changes:
        - createTable:
            tableName: establishment

            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: company_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true

        - addForeignKeyConstraint:
            baseTableName: establishment
            baseColumnNames: company_id
            referencedTableName: company
            referencedColumnNames: id
            constraintName: fk_establishment_company